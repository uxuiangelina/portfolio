<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Страница не найдена</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --dark-bg:#0B0B0C; --dark-text:#F5F5F3; --dark-text-2:rgba(245,245,243,.6); --dark-line:rgba(245,245,243,.12);
    --bg:#FAFAFA; --text:#111111; --text-2:#6E6E73;
    --accent:#4A5DE0; --accent-soft:rgba(74,93,224,.08);
    --accent-2:#FF6B4A; --accent-2-soft:rgba(255,107,74,.10);
    --line:rgba(17,17,17,.09); --line-strong:rgba(17,17,17,.16);
    --ease:cubic-bezier(.16,1,.3,1);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; font-size:14px; line-height:1.5;
    min-height:100vh; display:flex; flex-direction:column; overflow-x:hidden;
  }
  h1,h2{ font-family:'Manrope',sans-serif; font-weight:800; letter-spacing:-0.02em; }
  a{ color:inherit; text-decoration:none; }
  .wrap{ max-width:1180px; margin:0 auto; padding:0 32px; width:100%; }
  @media (max-width:640px){ .wrap{ padding:0 20px; } }

  main{ flex:1; display:flex; align-items:center; justify-content:center; position:relative; padding:100px 0 80px; overflow:hidden; }
  .blob{ position:absolute; border-radius:50%; filter:blur(90px); opacity:.3; z-index:0; }
  .blob-1{ width:420px; height:420px; background:var(--accent); top:-120px; left:-100px; animation:float 10s ease-in-out infinite; }
  .blob-2{ width:340px; height:340px; background:var(--accent-2); bottom:-140px; right:-100px; animation:float 12s ease-in-out infinite reverse; }
  @keyframes float{ 0%,100%{ transform:translate(0,0); } 50%{ transform:translate(20px,-16px); } }
  @keyframes bob{ 0%,100%{ transform:translate(0,0) rotate(-6deg); } 50%{ transform:translate(0,-10px) rotate(-6deg); } }

  .layout{ position:relative; z-index:1; display:grid; grid-template-columns:1.15fr .85fr; gap:56px; align-items:center; }
  @media (max-width:860px){ .layout{ grid-template-columns:1fr; gap:44px; } }

  .content{ text-align:left; }

  .code{
    font-family:'Manrope'; font-weight:800; font-size:clamp(130px,15vw,260px); line-height:1;
    background:linear-gradient(120deg,var(--text) 15%, var(--accent) 130%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    margin-bottom:18px;
    text-shadow:0 20px 40px rgba(17,17,17,.06);
  }

  .figure{ position:relative; display:flex; justify-content:center; }
  @media (max-width:860px){ .figure{ order:-1; } }
  .photo-wrap{ position:relative; width:min(320px,80vw); z-index:1; }
  .photo-wrap img{
    width:100%; display:block; border-radius:26px;
    -webkit-mask-image:linear-gradient(to bottom, black 80%, transparent 100%);
    mask-image:linear-gradient(to bottom, black 80%, transparent 100%);
  }

  .sticker{
    position:absolute; top:6%; right:-12%; z-index:3;
    background:#fff; border:1px solid var(--line); border-radius:18px 18px 4px 18px;
    padding:10px 16px; font-family:'Manrope',sans-serif; font-weight:800; font-size:15px;
    box-shadow:0 14px 30px rgba(17,17,17,.12); transform:rotate(6deg);
    animation:bob 3.2s ease-in-out infinite;
  }
  .sticker::after{
    content:"👀"; margin-left:6px;
  }
  @media (max-width:640px){ .sticker{ right:-2%; top:-6%; font-size:13px; padding:8px 13px; } }

  .content h2{ font-size:clamp(20px,3vw,28px); margin:0 0 14px; }
  .content p{ color:var(--text-2); font-size:14px; max-width:44ch; margin:0 0 40px; }

  .actions{ display:flex; gap:14px; justify-content:flex-start; flex-wrap:wrap; }
  .btn{ display:inline-flex; align-items:center; gap:8px; padding:14px 24px; border-radius:999px; font-size:14px; font-weight:600; transition:all .3s var(--ease); }
  .btn-primary{ background-image:linear-gradient(100deg,var(--text) 0%, var(--accent) 100%); color:#fff; border:none; }
  .btn-primary:hover{ transform:translateY(-2px); filter:brightness(1.1); }
  .btn-ghost{ border:1px solid var(--line-strong); }
  .btn-ghost:hover{ border-color:var(--text); transform:translateY(-2px); }
</style>
</head>
<body>
<main>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="wrap layout">

    <div class="content">
      <div class="code">404</div>
      <h2>Такой страницы нет</h2>
      <p>Еще не успела навайбкодить, зайдите позже</p>
      <div class="actions">
        <a href="https://uxuiangelina.github.io/portfolio/index.html" class="btn btn-primary">На главную</a>
      </div>
    </div>

    <div class="figure">
      <div class="photo-wrap">
        <div class="sticker">Блин!</div>
        <img src="https://raw.githubusercontent.com/uxuiangelina/portfolio/main/images/404.jpeg" alt="Страница не найдена">
      </div>
    </div>

  </div>
</main>
</body>
</html>
