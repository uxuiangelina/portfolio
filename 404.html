<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Страница не найдена</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --dark-bg:#0B0B0C; --dark-text:#F5F5F3; --dark-text-2:rgba(245,245,243,.6); --dark-line:rgba(245,245,243,.12);
    --bg:#FAFAFA; --text:#111111; --text-2:#6E6E73;
    --accent:#4A5DE0; --accent-soft:rgba(74,93,224,.08);
    --accent-2:#FF6B4A; --accent-2-soft:rgba(255,107,74,.10);
    --line:rgba(17,17,17,.09); --line-strong:rgba(17,17,17,.16);
    --ease:cubic-bezier(.16,1,.3,1);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; font-size:17px; line-height:1.5;
    min-height:100vh; display:flex; flex-direction:column; overflow-x:hidden;
  }
  h1,h2{ font-family:'Manrope',sans-serif; font-weight:800; letter-spacing:-0.02em; }
  a{ color:inherit; text-decoration:none; }
  .wrap{ max-width:720px; margin:0 auto; padding:0 32px; }
  @media (max-width:640px){ .wrap{ padding:0 20px; } }

  main{ flex:1; display:flex; align-items:center; justify-content:center; position:relative; padding:80px 0; overflow:hidden; }
  .blob{ position:absolute; border-radius:50%; filter:blur(90px); opacity:.3; z-index:0; }
  .blob-1{ width:420px; height:420px; background:var(--accent); top:-120px; left:-100px; animation:float 10s ease-in-out infinite; }
  .blob-2{ width:340px; height:340px; background:var(--accent-2); bottom:-140px; right:-100px; animation:float 12s ease-in-out infinite reverse; }
  @keyframes float{ 0%,100%{ transform:translate(0,0); } 50%{ transform:translate(20px,-16px); } }

  .content{ position:relative; z-index:1; text-align:center; }
  .code{
    font-family:'Manrope'; font-weight:800; font-size:clamp(90px,18vw,160px); line-height:1;
    background:linear-gradient(120deg,var(--text) 20%, var(--accent) 120%);
    -webkit-background-clip:text; background-clip:text; color:transparent; margin-bottom:8px;
  }
  .content h2{ font-size:clamp(20px,3vw,28px); margin-bottom:14px; }
  .content p{ color:var(--text-2); font-size:16px; max-width:44ch; margin:0 auto 40px; }

  .actions{ display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin-bottom:44px; }
  .btn{ display:inline-flex; align-items:center; gap:8px; padding:14px 24px; border-radius:999px; font-size:14px; font-weight:600; transition:all .3s var(--ease); }
  .btn-primary{ background-image:linear-gradient(100deg,var(--text) 0%, var(--accent) 100%); color:#fff; border:none; }
  .btn-primary:hover{ transform:translateY(-2px); filter:brightness(1.1); }
  .btn-ghost{ border:1px solid var(--line-strong); }
  .btn-ghost:hover{ border-color:var(--text); transform:translateY(-2px); }

  .quick-links{ display:flex; gap:22px; justify-content:center; flex-wrap:wrap; font-size:13px; }
  .quick-links a{ color:var(--text-2); font-weight:600; }
  .quick-links a:hover{ color:var(--accent); }
  .quick-links span{ color:var(--line-strong); }

  footer.footer-dark{ background:var(--dark-bg); border-top:1px solid var(--dark-line); padding:36px 0; }
  footer.footer-dark .wrap{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px; }
  footer.footer-dark span{ font-size:13px; color:var(--dark-text-2); }
  .footer-links{ display:flex; gap:24px; list-style:none; font-size:14px; color:var(--dark-text-2); }
  .footer-links a:hover{ color:#fff; }
</style>
</head>
<body>
<main>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="wrap content">
    <div class="code">404</div>
    <h2>Такого экрана в этой системе нет</h2>
    <p>Похоже, страница переехала, была переименована или никогда не существовала. Проверьте адрес или вернитесь на главную.</p>
    <div class="actions">
      <a href="portfolio.html" class="btn btn-primary">На главную</a>
      <a href="portfolio.html#work" class="btn btn-ghost">Смотреть кейсы</a>
    </div>
    <div class="quick-links">
      <a href="cases.html">Все кейсы</a><span>·</span>
      <a href="about.html">Обо мне</a><span>·</span>
      <a href="blog.html">Блог</a>
    </div>
  </div>
</main>

<footer class="footer-dark">
  <div class="wrap">
    <span>© 2026 · UX/UI Designer</span>
    <ul class="footer-links">
      <li><a href="mailto:hello@yourname.com">E-mail</a></li>
      <li><a href="https://t.me/yourname">Telegram</a></li>
      <li><a href="https://wa.me/00000000000">WhatsApp</a></li>
    </ul>
  </div>
</footer>
</body>
</html>
